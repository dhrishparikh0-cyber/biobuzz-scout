services:
  - type: web
    name: biobuzz-scout
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: biobuzz-db
          property: connectionString

databases:
  - name: biobuzz-db
    plan: free